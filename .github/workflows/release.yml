name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    name: Linux (.deb + .rpm)
    runs-on: ubuntu-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      npm_config_fetch_retries: 5
      npm_config_fetch_retry_mintimeout: 20000
      npm_config_fetch_retry_maxtimeout: 120000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-linux-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install RPM tools
        run: sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate icons
        run: npm run generate-icons

      - name: Test, typecheck and verify i18n coverage
        run: npm test && npm run typecheck

      # Depois dos testes: o rebuild compila o módulo nativo para o ABI do
      # Electron, que o Node do runner não consegue carregar.
      - name: Rebuild native dependencies
        run: npx electron-rebuild -f -w better-sqlite3-multiple-ciphers

      - name: Build app
        run: npm run build

      - name: Fix electron-builder executable permission
        run: chmod +x node_modules/app-builder-bin/linux/x64/app-builder

      - name: Package (deb + rpm)
        working-directory: apps/electron
        run: npx electron-builder --linux deb rpm --publish never

      - name: Copy .rpm to a fixed-name alias
        # O pacote do openSUSE Build Service (home:rodrigosbrito:fina) usa
        # o alias .../releases/latest/download/fina-latest.x86_64.rpm do
        # GitHub como Source0 do fina.spec, pra sempre pegar a release mais
        # nova sem precisar saber o número da versão de antemão. Esse
        # alias só funciona porque o nome do asset é fixo — o .rpm
        # "normal" (fina-<versão>.x86_64.rpm) muda de nome a cada release.
        run: cp apps/electron/dist/fina-*.x86_64.rpm apps/electron/dist/fina-latest.x86_64.rpm

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          files: |
            apps/electron/dist/*.deb
            apps/electron/dist/*.rpm
          generate_release_notes: true

  release-windows:
    name: Windows (.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache electron-builder binaries
        uses: actions/cache@v6
        with:
          path: ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-builder-cache-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      # O lockfile raiz foi gerado em Linux e pode não conter o pacote
      # opcional específico do Windows. Instale-o explicitamente antes de
      # gerar o ícone para evitar falha do binding nativo do resvg.
      - name: Install Windows resvg binding
        run: npm install --no-save --package-lock=false --ignore-scripts @resvg/resvg-js-win32-x64-msvc@2.6.2

      - name: Generate icons
        run: npm run generate-icons

      - name: Test, typecheck and verify i18n coverage
        run: npm test && npm run typecheck

      # Depois dos testes: o rebuild compila o módulo nativo para o ABI do
      # Electron, que o Node do runner não consegue carregar.
      - name: Rebuild native dependencies
        run: npx electron-rebuild -f -w better-sqlite3-multiple-ciphers

      - name: Build app
        run: npm run build

      - name: Package (NSIS installer)
        working-directory: apps/electron
        run: npx electron-builder --win nsis --publish never

      - name: Validate updater metadata matches the built installer
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sed -n 's/^path: //p' apps/electron/dist/latest.yml | head -n1 | tr -d '\r')"
          if [ -z "$expected" ]; then
            echo "Erro: não foi possível ler o campo 'path' em dist/latest.yml"
            exit 1
          fi
          if [ ! -f "apps/electron/dist/$expected" ]; then
            echo "Erro: latest.yml aponta para '$expected', mas o arquivo não foi gerado em dist/."
            echo "Artefatos gerados:"
            ls -1 apps/electron/dist
            exit 1
          fi
          echo "OK: latest.yml e o instalador estão alinhados ($expected)."

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: false
          files: |
            apps/electron/dist/*.exe
            apps/electron/dist/latest.yml
            apps/electron/dist/*.blockmap

  mark-desktop-latest:
    name: Mark complete desktop release as latest
    needs: [release-linux, release-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --latest
